<!DOCTYPE html>
<html>
<head>
  <title>Multiplayer Game Menu</title>
  <style>
    body {
      margin: 0;
      background: linear-gradient(to bottom, #1e1e2f, #111);
      font-family: Arial;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .menu {
      text-align: center;
    }

    button {
      width: 250px;
      padding: 15px;
      margin: 10px;
      border: none;
      border-radius: 12px;
      background: #ff9800;
      color: white;
      font-size: 20px;
    }
  </style>
</head>
<body>
  <div class="menu">
    <h1>Multiplayer Platform Game</h1>
    <button>Play Online</button>
    <button>Single Player</button>
    <button>Shop</button>
    <button>Leaderboard</button>
    <button>Settings</button>
  </div>
</body>
</html>
