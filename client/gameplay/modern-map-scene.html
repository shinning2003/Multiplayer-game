<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gameplay Scene</title>
<style>
body{
margin:0;
overflow:hidden;
background:#070b17;
font-family:Arial;
}
.sky{
position:absolute;
width:100%;
height:100%;
background:linear-gradient(180deg,#172554,#020617);
}
.neon-city{
position:absolute;
bottom:0;
width:100%;
height:60%;
background:url('https://images.unsplash.com/photo-1526401485004-46910ecc8e51?q=80&w=1600&auto=format&fit=crop') center/cover;
opacity:0.4;
}
.platform{
position:absolute;
background:linear-gradient(90deg,#6d28d9,#2563eb);
border-radius:18px;
box-shadow:0 0 25px rgba(37,99,235,0.6);
}
.platform.main{
width:520px;
height:42px;
left:50%;
bottom:160px;
transform:translateX(-50%);
}
.platform.small1{
width:220px;
height:32px;
left:180px;
bottom:320px;
}
.platform.small2{
width:220px;
height:32px;
right:180px;
bottom:360px;
}
.player{
position:absolute;
width:90px;
height:120px;
border-radius:24px;
background:linear-gradient(180deg,#ff4d4d,#ff9800);
box-shadow:0 0 40px rgba(255,100,0,0.6);
animation:bounce 2s infinite;
}
.player.one{
left:42%;
bottom:205px;
}
.player.two{
left:52%;
bottom:205px;
background:linear-gradient(180deg,#00c853,#00b0ff);
}
.coin{
position:absolute;
width:34px;
height:34px;
border-radius:50%;
background:gold;
box-shadow:0 0 20px gold;
animation:spin 1.5s linear infinite;
}
.coin.c1{left:260px;bottom:390px;}
.coin.c2{right:260px;bottom:430px;}
.hud{
position:absolute;
top:20px;
left:20px;
display:flex;
gap:16px;
}
.hud div{
background:rgba(15,20,40,0.85);
padding:14px 20px;
border-radius:18px;
color:white;
backdrop-filter:blur(10px);
}
@keyframes bounce{
0%{transform:translateY(0)}
50%{transform:translateY(-10px)}
100%{transform:translateY(0)}
}
@keyframes spin{
0%{transform:rotateY(0deg)}
100%{transform:rotateY(360deg)}
}
</style>
</head>
<body>
<div class="sky"></div>
<div class="neon-city"></div>
<div class="hud">
<div>Coins: 1250</div>
<div>Players: 5/5</div>
<div>Ping: 28ms</div>
</div>
<div class="platform main"></div>
<div class="platform small1"></div>
<div class="platform small2"></div>
<div class="coin c1"></div>
<div class="coin c2"></div>
<div class="player one"></div>
<div class="player two"></div>
</body>
</html>
